# The gate from docs/RELEASE.md on every push and pull request: formatting,
# both test profiles, clippy with warnings denied, and warning-free docs — on
# Linux, macOS and Windows, at stable and the minimum supported Rust version.
#
# Windows is a full test leg, not a `cargo check`, because the release ships a
# Windows binary and an untested artifact is worse than an absent one. There is
# no `libc`; platform branches use `std` only. In particular, regular-file
# identity uses Unix metadata under `cfg(unix)` with portable type checks on
# other hosts, while the advisory lock uses `std::fs::File::try_lock` on every
# platform. `.gitattributes` pins LF so the byte-exact fixtures survive a
# Windows checkout.
#
# `RUSTUP_TOOLCHAIN` is what makes the matrix real. rust-toolchain.toml pins
# 1.89.0, and that file outranks `rustup default`; without the environment
# variable every "stable" leg would silently run the pinned toolchain and the
# matrix would test one version twice.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_only:
        description: Verify a native acceptance checkpoint without repeating portable gates
        type: boolean
        default: false
      owner_sensitivity_only:
        description: Verify the public preparation-owner refusal guard in isolation
        type: boolean
        default: false
      sensitivity_guard:
        description: Native guard selected for the isolated sensitivity proof
        type: choice
        options:
          - preparation-owner
          - association-deadline
        default: preparation-owner

# Preserve the running develop checkpoint and queue its latest successor.
# Other branches and pull requests cancel superseded runs; tag gates remain
# independent and are never interrupted by a later run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  gate:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.native_only && !inputs.owner_sensitivity_only) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    # The chaos harness spawns 1,000 processes per profile; that dominates the
    # run, and process creation on Windows is several times costlier than on
    # Unix. The rest of the suite is fast.
    # Full stable Windows debug/release coverage can exceed 45 minutes while
    # still passing tests; retain the complete inventory with a bounded budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 75 || 45 }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare task cache
        shell: bash
        run: |
          task_cache="$HOME/.cache/fsm-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$task_cache"
          printf 'TMPDIR=%s\n' "$task_cache" >> "$GITHUB_ENV"
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      # Caches built dependencies keyed by lockfile and toolchain; the shared
      # key lets the release workflow restore what this job saves on develop.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}-${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      # clippy has no file-length lint, so the thousand-line rule in
      # CONTRIBUTING.md is enforced by a script rather than by the compiler.
      - run: scripts/oversized-files.sh
      # `--no-fail-fast`: without it cargo stops at the first failing test
      # binary, so a platform-specific failure hides every later binary on
      # that leg and a fix costs one whole CI round per hidden failure. The
      # local recipe in CONTRIBUTING.md already runs it this way.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test --workspace --release --no-fail-fast
      # `--all-targets` since plan 0019: test code is compiled code, and it is
      # the larger half of this repository. While this ran without the flag, a
      # test target that did not compile under the workspace's own
      # `print_stderr` deny sat green for eight plans. CONTRIBUTING.md and
      # docs/RELEASE.md carry the same command; keep all three in step.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      # The fuzz crate is its own workspace, so `--workspace` above never
      # touches it and its targets drift out of the API they call. Two had:
      # they stopped compiling somewhere in plans 0009-0016 and nothing said
      # so, because the only job that builds them runs on a tag. This is a
      # plain build — the instrumented one still needs nightly and cargo-fuzz
      # in `release.yml` — and it is the cheap half that catches the rot.
      #
      # Linux only, which is both where `fuzz-smoke` runs and the only place
      # these can link at all: the targets are `#![no_main]` and libFuzzer
      # supplies the entry point, so the MSVC linker refuses them outright
      # (`LNK1561: entry point must be defined`).
      - name: Fuzz targets still compile
        if: runner.os == 'Linux'
        run: cargo build --manifest-path fuzz/Cargo.toml --bins
      # Committed decimal vectors must be reproducible from the generator on
      # every leg; a stale fixture fails before it can mislead a release.
      - name: Decimal vectors regenerate byte-identically
        shell: bash
        run: |
          work="$(mktemp -d)"
          python3 tools/gen_decimal_vectors.py "$work/dec-a.jsonl"
          python3 tools/gen_decimal_vectors.py "$work/dec-b.jsonl"
          cmp "$work/dec-a.jsonl" "$work/dec-b.jsonl"
          cmp "$work/dec-a.jsonl" crates/fsm-core/tests/fixtures/decimal/generated_vectors.jsonl

  # The initial contained executor requires a provisioned Linux/systemd
  # runtime. These are real administrative fault probes, separate from the
  # portable six-leg Rust gate; missing facilities fail rather than skip.
  native-containment:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.owner_sensitivity_only }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.89.0"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Prepare native task cache
        run: |
          native_cache="$HOME/.cache/fsm-native-${{ matrix.rust }}"
          mkdir -p "$native_cache"
          printf 'FSM_NATIVE_CACHE=%s\nTMPDIR=%s\nCARGO_TARGET_DIR=%s\n' "$native_cache" "$native_cache" "$native_cache/target" >> "$GITHUB_ENV"
      - name: Provisioned native containment matrix
        run: >-
          python3 crates/fsm-execute/tests/lifecycle_platform/native_matrix.py
          --toolchain '${{ matrix.rust }}'
          --report-dir '${{ env.FSM_NATIVE_CACHE }}/native-evidence'
      - name: Provisioned original CLI workflow scenarios
        run: >-
          python3 crates/fsm-execute/tests/lifecycle_platform/workflow_probe.py
          --toolchain '${{ matrix.rust }}'
          --report '${{ env.FSM_NATIVE_CACHE }}/native-evidence/workflow.json'
      - name: Original executor upgrade inspection and drain
        run: |
          git fetch --depth=1 origin 5730f17202cdeabd8c34f9b1c48fcf02f26b0e06
          git worktree add --detach "$FSM_NATIVE_CACHE/upgrade-source" 5730f17202cdeabd8c34f9b1c48fcf02f26b0e06
          python3 crates/fsm-execute/tests/lifecycle_platform/workflow_probe.py --toolchain '${{ matrix.rust }}' --upgrade-source "$FSM_NATIVE_CACHE/upgrade-source" --report "$FSM_NATIVE_CACHE/native-evidence/upgrade.json"
      - name: Retain exact native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-containment-${{ matrix.rust }}
          path: ${{ env.FSM_NATIVE_CACHE }}/native-evidence
          if-no-files-found: error

  owner-sensitivity:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_sensitivity_only }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.89.0"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Prepare native sensitivity cache
        run: |
          native_cache="$HOME/.cache/fsm-native-owner-${{ matrix.rust }}"
          mkdir -p "$native_cache"
          printf 'FSM_NATIVE_CACHE=%s\nTMPDIR=%s\nCARGO_TARGET_DIR=%s\n' "$native_cache" "$native_cache" "$native_cache/target" >> "$GITHUB_ENV"
      - name: Original, neutralized and restored native guard refusal
        run: >-
          python3 crates/fsm-execute/tests/lifecycle_platform/owner_sensitivity.py
          --toolchain '${{ matrix.rust }}'
          --guard '${{ inputs.sensitivity_guard }}'
          --report '${{ env.FSM_NATIVE_CACHE }}/native-evidence/owner-sensitivity.json'
      - name: Retain native sensitivity evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-owner-sensitivity-${{ matrix.rust }}
          path: ${{ env.FSM_NATIVE_CACHE }}/native-evidence
          if-no-files-found: error

  # The zero-dependency guarantee and the core-only embed boundary are
  # properties of the resolved graph, so keep explicit cheap checks that do
  # not depend on the test matrix merely happening to compile the crates.
  zero-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare task cache
        shell: bash
        run: |
          task_cache="$HOME/.cache/fsm-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$task_cache"
          printf 'TMPDIR=%s\n' "$task_cache" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo test -p fsm-cli --test zero_deps
      - name: Embed acceptance depends on fsm-core alone
        shell: bash
        run: |
          packages="$(
            cargo tree -p fsm-embed-acceptance --depth 1 --prefix none \
              --target all --all-features --format '{p}'
          )"
          [[ $(printf '%s\n' "$packages" | awk 'END { print NR }') -eq 2 ]]
          [[ $(printf '%s\n' "$packages" | sed -n '1p') == fsm-embed-acceptance\ v* ]]
          [[ $(printf '%s\n' "$packages" | sed -n '2p') == fsm-core\ v* ]]
