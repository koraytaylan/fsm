# The gate from docs/RELEASE.md on every push and pull request: formatting,
# both test profiles, clippy with warnings denied, and warning-free docs — on
# Linux, macOS and Windows, at stable and the minimum supported Rust version.
#
# Windows is a full test leg, not a `cargo check`, because the release ships a
# Windows binary and an untested artifact is worse than an absent one. Nothing
# in the workspace is Unix-specific: there is no `libc`, no `std::os`, and the
# store's advisory lock is `std::fs::File::try_lock`, which is flock on Unix and
# LockFileEx on Windows. `.gitattributes` pins LF so the byte-exact fixtures
# survive a Windows checkout.
#
# `RUSTUP_TOOLCHAIN` is what makes the matrix real. rust-toolchain.toml pins
# 1.89.0, and that file outranks `rustup default`; without the environment
# variable every "stable" leg would silently run the pinned toolchain and the
# matrix would test one version twice.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    # The chaos harness spawns 1,000 processes per profile; that dominates the
    # run, and process creation on Windows is several times costlier than on
    # Unix. The rest of the suite is fast.
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      # Caches built dependencies keyed by lockfile and toolchain; the shared
      # key lets the release workflow restore what this job saves on develop.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}-${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      # Not `--all-targets`: the test targets carry pre-existing clippy lint
      # debt. rustc warnings in tests are already denied through RUSTFLAGS
      # above, so this is narrower than it looks. Widen it once that debt is
      # paid, and keep docs/RELEASE.md in step.
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo doc --workspace --no-deps

  # The zero-dependency guarantee is a property of the resolved graph, so it is
  # worth one explicit, cheap check that does not depend on the test matrix
  # happening to run.
  zero-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo test -p fsm-cli --test zero_deps
