name: installed-executor-check

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Immutable develop candidate SHA
        required: true
        type: string
      scenario:
        description: Focused installed workflow inventory
        required: true
        type: choice
        default: executor_transport_outcome_matrix_progresses_with_quiet_clients
        options:
          - executor_stdio_process_success_progresses_with_a_quiet_client
          - executor_stdio_outcome_matrix_progresses_with_quiet_clients
          - executor_transport_outcome_matrix_progresses_with_quiet_clients
          - executor_transport_admission_and_manual_effects_preserve_pending_work
          - executor_transport_read_only_and_degraded_hosts_refuse_execution
          - executor_http_unread_and_disconnected_sessions_do_not_stop_active_work
          - executor_stdio_shutdown_and_restart_preserve_original_claims
          - executor_http_shutdown_and_restart_preserve_original_claims
          - executor_standalone_shutdown_and_restart_preserve_original_claims
          - executor_active_drain_preserves_original_success_and_pending_work
          - executor_stdio_paused_and_retired_output_preserves_native_work
          - executor_supervisor_death_refuses_until_a_new_epoch_recovers_original_work
          - full

permissions:
  contents: read

jobs:
  installed-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      RUSTUP_TOOLCHAIN: stable
      PYTHONDONTWRITEBYTECODE: "1"
      FSM_ACCEPTANCE_DISPOSABLE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
      - name: Prepare explicit task cache
        run: |
          installed_cache="$HOME/.cache/fsm-installed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$installed_cache"
          printf 'TMPDIR=%s\nCARGO_TARGET_DIR=%s\n' "$installed_cache" "$installed_cache/target" >> "$GITHUB_ENV"
          free -h
          swapon --show
      - run: rustup toolchain install stable --profile minimal
      - name: Focused independent observer checks
        run: python3 -m unittest discover -s acceptance/tests -p 'test*observer.py'
      - name: Consumer install and actual contained workflows
        env:
          FSM_INSTALLED_CANDIDATE: ${{ inputs.candidate }}
          FSM_INSTALLED_SCENARIO: ${{ inputs.scenario }}
        run: timeout 900s python3 acceptance/run-installed-executor.py --candidate "$FSM_INSTALLED_CANDIDATE" --scenario "$FSM_INSTALLED_SCENARIO"
      - name: Retain focused installed evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installed-workflow-evidence
          path: ${{ env.TMPDIR }}/installed-executor-check/evidence
          if-no-files-found: error
