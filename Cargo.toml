[workspace]
members = [
    "crates/fsm-core",
    "crates/fsm-store",
    "crates/fsm-execute",
    "crates/fsm-cli",
    "crates/fsm-embed-acceptance",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/koraytaylan/fsm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
